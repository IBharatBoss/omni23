<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#176B74">
  <meta name="description" content="Convert, compress, and edit Images, PDFs & Vectors directly in your browser with instant WebAssembly speed. Zero cloud uploads.">
  <meta name="keywords" content="image compress, pdf merge, pdf split, image resize, image convert, webp convert, zero server, browser tools">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OmniTools">

  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="OmniTools - Zero-Server Browser Swiss Knife">
  <meta property="og:description" content="Convert, compress, and edit Images, PDFs & Vectors directly in your browser with instant WebAssembly speed. Zero cloud uploads.">
  <meta property="og:url" content="https://yourdomain.com/">
  <meta property="og:image" content="https://yourdomain.com/logo.webp">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="OmniTools - Zero-Server Browser Swiss Knife">
  <meta name="twitter:description" content="Convert, compress, and edit Images, PDFs & Vectors directly in your browser with instant WebAssembly speed. Zero cloud uploads.">
  <meta name="twitter:image" content="https://yourdomain.com/logo.webp">

  <link rel="canonical" href="https://yourdomain.com/">

  <title>OmniTools - Zero-Server Browser Swiss Knife</title>

  <!-- Structured Data / JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "OmniTools",
    "url": "https://yourdomain.com/",
    "description": "Convert, compress, and edit Images, PDFs & Vectors directly in your browser with instant WebAssembly speed.",
    "applicationCategory": "UtilitiesApplication",
    "operatingSystem": "Any"
  }
  </script>

  <link rel="icon" type="image/webp" href="./logo.webp">
  <link rel="apple-touch-icon" href="./logo.webp">
  <link rel="preload" href="./logo.webp" as="image" type="image/webp">

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/command-bar.css">
</head>

<body>
  <noscript>
    <div style="background-color: #C53030; color: white; padding: 20px; text-align: center; font-family: sans-serif;">
      <strong>JavaScript is disabled.</strong> OmniTools requires JavaScript to process files locally in your browser. Please enable it to use this app.
    </div>
  </noscript>
  <!-- Hidden Global File Input for Mobile Tap-to-Upload -->
  <input type="file" id="global-file-input" multiple class="sr-only" style="display: none;">

  <!-- Fullscreen Frosted Liquid Glass Drop Target -->
  <div id="app-dropzone" class="dropzone-fullscreen hidden">
    <div class="dropzone-fullscreen-card animate-fade-in">
      <div class="dropzone-upload-icon" style="width: 72px; height: 72px; font-size: 2.2rem;">📁</div>
      <h2 style="font-size: 1.5rem;">Drop files anywhere</h2>
      <p style="color: var(--text-secondary); font-size: 0.95rem;">Instant local transformation with zero server
        uploads.</p>
    </div>
  </div>

  <main id="app-main">
    <!-- Top Navigation Bar -->
    <header class="app-topbar">
      <a href="#/" class="brand-logo" id="brand-logo-btn" title="OmniTools Home">
        <img src="./logo.webp" alt="OmniTools Logo" class="brand-logo-img">
      </a>

      <div class="topbar-actions">
        <button id="btn-cmd-k" class="glass-btn" style="padding: 8px 14px; font-size: 0.88rem;" aria-label="Search Tools">
          <span>🔍</span>
          <span style="display: none;" class="desktop-only-text">Search Tools</span>
          <span class="kbd-badge" style="display: none;">⌘K</span>
        </button>

        <button id="btn-open-ai" class="icon-btn" title="AI Copilot" aria-label="AI Copilot">
          ✨
        </button>
      </div>
    </header>

    <!-- Decoupled Home View (Grid & Categories) -->
    <div id="home-view" class="animate-fade-in"></div>

    <!-- Decoupled Tool Studio View (Options, Dropzone, Batch Queue) -->
    <div id="studio-view" class="studio-view hidden"></div>
  </main>

  <!-- Mobile Bottom Navigation Dock -->
  <nav class="mobile-nav-dock">
    <div class="mobile-nav-item active" id="dock-home-btn">
      <span class="mobile-nav-icon">🏠</span>
      <span>Home</span>
    </div>
    <div class="mobile-nav-item" id="dock-upload-btn">
      <span class="mobile-nav-icon">⬆</span>
      <span>Upload</span>
    </div>
    <div class="mobile-nav-item" id="dock-search-btn">
      <span class="mobile-nav-icon">🔍</span>
      <span>Search</span>
    </div>
    <div class="mobile-nav-item" id="dock-ai-btn">
      <span class="mobile-nav-icon">✨</span>
      <span>AI Copilot</span>
    </div>
  </nav>

  <!-- Spotlight Command Bar (Cmd+K) Modal -->
  <div id="command-bar-overlay" class="overlay hidden">
    <div id="command-bar" class="glass-panel">
      <div class="cmd-input-wrapper">
        <span class="cmd-icon">⌘</span>
        <input type="text" id="cmd-input" placeholder="Search tools or ask AI copilot..." autocomplete="off">
        <button class="icon-btn" id="close-cmd-bar" style="width: 32px; height: 32px; font-size: 1rem; color: #FFFFFF; background: rgba(255, 255, 255, 0.15); flex-shrink: 0;" title="Close" aria-label="Close search bar">✕</button>
      </div>
      <div id="cmd-results" class="cmd-results"></div>
    </div>
  </div>

  <!-- Mobile-Responsive AI Copilot Modal Overlay -->
  <div id="chat-overlay" class="overlay hidden">
    <div id="chat-drawer" class="glass-panel">
      <div class="chat-header">
        <div class="chat-header-info">
          <span class="ai-status"></span>
          <h3>AI Copilot</h3>
        </div>
        <button class="icon-btn" id="close-chat" style="width: 32px; height: 32px; font-size: 1rem;" aria-label="Close AI Copilot" title="Close AI Copilot">✕</button>
      </div>
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" class="chat-input" id="chat-user-input" placeholder="Ask AI anything..." autocomplete="off">
        <button class="chat-send-btn" id="chat-send-btn">➤</button>
      </div>
    </div>
  </div>

  <!-- Smart Ingest Tool Selector Modal (Opens when uploading files from Home Screen) -->
  <div id="ingest-picker-overlay" class="overlay hidden">
    <div id="ingest-picker-modal" class="glass-panel">
      <div class="ingest-picker-header">
        <div class="ingest-header-text">
          <h3 style="font-size: 1.05rem; font-weight: 800; color: #FFFFFF; margin: 0;">Choose Action for Files</h3>
          <span id="ingest-file-count" style="font-size: 0.78rem; color: rgba(255, 255, 255, 0.85);">0 Files Selected</span>
        </div>
        <button class="icon-btn" id="close-ingest-picker" style="width: 32px; height: 32px; font-size: 1rem; color: #FFFFFF; background: rgba(255, 255, 255, 0.15);" aria-label="Close tool picker" title="Close tool picker">✕</button>
      </div>
      <div id="ingest-tools-list" class="ingest-tools-list"></div>
    </div>
  </div>

  <style>
    @media (min-width: 640px) {
      .desktop-only-text,
      .kbd-badge {
        display: inline-block !important;
      }
    }
  </style>

  <!-- PDF Editing Libraries are now lazy-loaded on demand -->

  <!-- Application Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>

</html>
